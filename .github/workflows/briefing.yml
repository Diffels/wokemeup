name: briefing

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch sources and print items only; publish nothing"
        type: boolean
        default: false
  # Hourly schedule is enabled in M5 (CLAUDE.md §8.2), once the once-per-day
  # guard and the fallback exist. Until then, run it manually.
  # schedule:
  #   - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build briefing
        env:
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pipeline.main ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Commit docs/
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Publish briefing $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
